name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'
  # Manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Deploy on every push or merge to main. On any other branch, deploy when
    # any commit in the push (not just the last one) mentions "@deploy".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(join(github.event.commits.*.message, ' '), '@deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # GitHub Pages is the staging host (sweb.projectautomate.com): PUBLIC_NOINDEX
      # makes Seo.astro emit robots noindex on every page so it never competes
      # with the production site in search results.
      - name: Build
        run: npm run build
        env:
          PUBLIC_NOINDEX: '1'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
